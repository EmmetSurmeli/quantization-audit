[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantization-audit"
version = "0.1.0"
description = "A reproducible calibration-transfer audit for quantized language models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "huggingface-hub>=0.25", "datasets>=3,<5"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.29,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8"]

[project.scripts]
qaudit = "qaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
